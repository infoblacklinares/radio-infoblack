<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio InfoBlack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 24px 16px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .logo span { color: #e63946; }

    .tagline {
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 1px;
      margin-bottom: 60px;
    }

    .power-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid #333;
      background: #111;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .power-btn svg {
      width: 56px;
      height: 56px;
      fill: #444;
      transition: fill 0.3s ease;
    }

    .power-btn.active {
      border-color: #e63946;
      animation: pulse 2s infinite;
    }
    .power-btn.active svg { fill: #e63946; }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 20px rgba(230,57,70,0.5), 0 0 40px rgba(230,57,70,0.2); }
      50%      { box-shadow: 0 0 40px rgba(230,57,70,0.8), 0 0 80px rgba(230,57,70,0.4); }
    }

    .status {
      margin-top: 32px;
      font-size: 0.9rem;
      color: #555;
      letter-spacing: 2px;
      transition: color 0.3s;
      min-height: 22px;
    }
    .status.active { color: #e63946; }

    .countdown {
      margin-top: 12px;
      font-size: 3rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 3px;
      min-height: 60px;
      transition: color 0.3s;
    }
    .countdown.active { color: #fff; }

    .now-playing {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 1px;
      min-height: 18px;
      transition: color 0.3s;
    }
    .now-playing.active { color: #888; }

    .tip {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.7rem;
      color: #2a2a2a;
      padding: 0 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="logo">INFO<span>BLACK</span></div>
  <div class="tagline">PUBLICIDAD EN MOVIMIENTO</div>

  <button class="power-btn" id="powerBtn" onclick="togglePower()">
    <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
  </button>

  <div class="status" id="status">APAGADO</div>
  <div class="countdown" id="countdown"></div>
  <div class="now-playing" id="nowPlaying"></div>

  <div class="tip">
    Abrí YouTube en otra pestaña de Chrome y dejá esta activa.<br>
    Ambas suenan al mismo tiempo.
  </div>

  <script>
    const INTERVAL_MS = 15 * 1000; // pruebas → producción: 5 * 60 * 1000
    const TRACKS = ['audio-1.mp3', 'audio-2.mp3', 'audio-3.mp3'];

    let running = false;
    let nextPlayAt = null;
    let rafId = null;
    let queue = [];
    let queueIndex = 0;

    const btn      = document.getElementById('powerBtn');
    const statusEl = document.getElementById('status');
    const countEl  = document.getElementById('countdown');
    const nowEl    = document.getElementById('nowPlaying');
    const adAudio  = new Audio();

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function nextTrack() {
      if (queueIndex >= queue.length) {
        const last = queue[queue.length - 1];
        do { queue = shuffle(TRACKS); } while (queue[0] === last);
        queueIndex = 0;
      }
      return queue[queueIndex++];
    }

    function togglePower() {
      running ? stop() : start();
    }

    function start() {
      running = true;
      queue = shuffle(TRACKS);
      queueIndex = 0;
      btn.classList.add('active');
      statusEl.classList.add('active');
      statusEl.textContent = 'EN VIVO';
      playAd();
      scheduleNext();
      tick();
    }

    function stop() {
      running = false;
      btn.classList.remove('active');
      statusEl.classList.remove('active');
      statusEl.textContent = 'APAGADO';
      countEl.classList.remove('active');
      countEl.textContent = '';
      nowEl.classList.remove('active');
      nowEl.textContent = '';
      nextPlayAt = null;
      cancelAnimationFrame(rafId);
      adAudio.pause();
      adAudio.currentTime = 0;
    }

    function scheduleNext() {
      nextPlayAt = Date.now() + INTERVAL_MS;
    }

    function playAd() {
      const track = nextTrack();
      adAudio.src = track;
      adAudio.currentTime = 0;
      adAudio.play().catch(() => {});
      nowEl.classList.add('active');
      nowEl.textContent = '▶ ' + track;
      adAudio.onended = () => {
        nowEl.textContent = '';
        nowEl.classList.remove('active');
      };
    }

    function tick() {
      if (!running) return;
      const remaining = nextPlayAt - Date.now();
      if (remaining <= 0) { playAd(); scheduleNext(); }
      const s = Math.ceil(remaining / 1000);
      const m = Math.floor(s / 60);
      countEl.classList.add('active');
      countEl.textContent = `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
      rafId = requestAnimationFrame(tick);
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch(e) {}
      }
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
  </script>
</body>
</html>
