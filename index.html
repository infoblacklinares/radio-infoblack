<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3a;
    --accent: #00ff88;
    --accent2: #ff3366;
    --text: #e8e8f0;
    --muted: #5a5a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    background-image:
      radial-gradient(ellipse at 20% 10%, #00ff8815 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, #ff336615 0%, transparent 50%);
  }
  header {
    width: 100%; max-width: 480px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); animation: blink 1.5s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
  header h1 { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:var(--accent); }
  header span { font-family:'Space Mono',monospace; font-size:10px; color:var(--muted); margin-left:auto; }

  /* RADIO SELECTOR */
  .radio-selector {
    width: 100%; max-width: 480px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px 24px; margin-bottom: 16px;
  }
  .section-label {
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
    margin-bottom: 14px;
  }
  .radio-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 380px; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .radio-list::-webkit-scrollbar { width: 4px; }
  .radio-list::-webkit-scrollbar-track { background: transparent; }
  .radio-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .radio-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px;
    cursor: pointer; transition: border-color .2s, background .2s;
    text-align: left; width: 100%;
  }
  .radio-btn:hover { border-color: var(--accent); background: #1a2a20; }
  .radio-btn.active { border-color: var(--accent); background: #0d1f17; }
  .radio-icon { font-size: 20px; flex-shrink: 0; }
  .radio-info { flex: 1; }
  .radio-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .radio-btn.active .radio-name { color: var(--accent); }
  .radio-freq { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
  .radio-check { color: var(--accent); font-size: 16px; opacity: 0; }
  .radio-btn.active .radio-check { opacity: 1; }

  .custom-url-wrap { display: flex; flex-direction: column; gap: 6px; }
  .inp-label { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 1px; }
  .inp-row { display: flex; gap: 8px; }
  .inp {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none;
    transition: border-color .2s;
  }
  .inp:focus { border-color: var(--accent); }
  .inp::placeholder { color: var(--muted); }
  .btn-sm {
    padding: 10px 16px; background: var(--accent); color: var(--bg);
    border: none; border-radius: 10px; font-family: 'Space Mono', monospace;
    font-size: 11px; cursor: pointer; font-weight: 700; white-space: nowrap;
    transition: background .2s;
  }
  .btn-sm:hover { background: #00ffaa; }

  /* PLAYER */
  .player {
    width: 100%; max-width: 480px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .player::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .now-playing-label {
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 3px; color: var(--muted); margin-bottom: 12px;
  }
  .track-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 30px;
    letter-spacing: 1px; color: var(--text); line-height: 1;
    margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

  .waveform { display: flex; align-items: center; gap: 3px; height: 32px; margin-bottom: 20px; }
  .waveform-bar { width: 3px; background: var(--accent); border-radius: 2px; opacity: .2; }
  .waveform-bar.active { opacity: 1; animation: wave .8s ease-in-out infinite; }
  @keyframes wave { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }

  .controls { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .btn-play {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); color: var(--bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s;
    box-shadow: 0 0 24px #00ff8850;
  }
  .btn-play:hover { transform: scale(1.08); background: #00ffaa; }
  .btn-play:active { transform: scale(.96); }

  /* AD RING */
  .ad-ring-wrap { display: none; flex-direction: column; align-items: center; gap: 6px; }
  .ad-ring-wrap.visible { display: flex; }
  .ad-ring-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 2px; color: var(--muted); }
  .ad-ring { width: 44px; height: 44px; position: relative; }
  .ad-ring svg { transform: rotate(-90deg); }
  .ad-ring-bg { fill: none; stroke: var(--border); stroke-width: 3; }
  .ad-ring-fill { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 113; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
  .ad-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 700; }

  /* AD BANNER */
  .ad-overlay {
    display: none; width: 100%; max-width: 480px;
    background: #0d1f17; border: 1px solid var(--accent);
    border-radius: 20px; padding: 20px 24px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .ad-overlay.visible { display: block; animation: fadeIn .4s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .ad-overlay::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); }
  .ad-tag { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 3px; color: var(--accent); margin-bottom: 8px; }
  .ad-brand { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; color: var(--accent); margin-bottom: 6px; }
  .ad-text { font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 14px; }
  .ad-text strong { color: var(--accent); }
  .ad-url { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); }
  .ad-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .ad-skip { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
  .ad-skip span { color: var(--accent); font-weight: 700; }
  .ad-pause-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 5px 12px; font-family: 'Space Mono', monospace; font-size: 10px; cursor: pointer; transition: background .2s; }
  .ad-pause-btn:hover { background: #0d2a1a; }
  .ad-pause-btn.paused { border-color: var(--accent2); color: var(--accent2); }
  /* Botón eliminar radio */
  .radio-btn { position: relative; }
  .radio-del { position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: #333; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: opacity .2s, color .2s; line-height: 1; }
  .radio-btn:hover .radio-del { opacity: 1; }
  .radio-del:hover { color: var(--accent2) !important; }

  /* WAVEFORM AD */
  .ad-wave { display: flex; align-items: center; gap: 3px; height: 20px; margin-top: 14px; }
  .ad-wave-bar { width: 3px; background: var(--accent); border-radius: 2px; opacity: 0; }
  .ad-wave-bar.on { opacity: 1; animation: wave .6s ease-in-out infinite; }

  /* AD INTERVAL */
  .ad-setting {
    width: 100%; max-width: 480px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .ad-setting-label { font-size: 13px; color: var(--muted); }
  .ad-setting select {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 12px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; cursor: pointer;
  }

  svg { display: block; }
</style>
</head>

        </svg>

      </div>

  <div class="ad-tag">📢 PUBLICIDAD</div>

  <div class="ad-controls">
    <div class="ad-skip">Vuelve la radio en <span id="adSkipNum">—</span>s</div>
    <button class="ad-pause-btn" id="adPauseBtn" onclick="toggleAdPause()">⏸ Pausar</button>
  </div>
  <div class="ad-wave" id="adWave"></div>
</div>

<!-- INTERVALO -->
<div class="ad-setting">
  <span class="ad-setting-label">🔊 Publicidad cada</span>
  <select id="adInterval">
    <option value="0.166">10 seg (prueba)</option>
    <option value="5">5 min</option>
    <option value="10" selected>10 min</option>
    <option value="15">15 min</option>
    <option value="20">20 min</option>
    <option value="30">30 min</option>
  </select>
</div>

<!-- Audio radio y audio publicidad son elementos separados -->
<audio id="radioEl"></audio>
<audio id="adAudioEl" preload="auto"></audio>

<script>
const radioEl     = document.getElementById('radioEl');
const adAudioEl   = document.getElementById('adAudioEl');
const btnPlay     = document.getElementById('btnPlay');
const iconPlay    = document.getElementById('iconPlay');
const trackTitle  = document.getElementById('trackTitle');
const trackSub    = document.getElementById('trackSub');
const waveformEl  = document.getElementById('waveform');
const adOverlay   = document.getElementById('adOverlay');
const adText      = document.getElementById('adText');
const adSkipNum   = document.getElementById('adSkipNum');
const adRingWrap  = document.getElementById('adRingWrap');
const adRingFill  = document.getElementById('adRingFill');
const adRingNum   = document.getElementById('adRingNum');
const adInterval  = document.getElementById('adInterval');
const radioList   = document.getElementById('radioList');
const btnCustom   = document.getElementById('btnCustom');
const customUrl   = document.getElementById('customUrl');
const adWaveEl    = document.getElementById('adWave');

let isPlaying    = false;
let adActive     = false;
let adIdx        = 0;
let trackIdx     = 0;
let ringId       = null;
let ringSeconds  = 0;
let ringTotal    = 0;

let currentUrl   = 'https://mdstrm.com/audio/637f68ddce4b1208597d8a86/icecast.audio';
let currentName  = 'Radio Carolina';

// Audios de publicidad (aleatorio sin repetir)
const TRACKS = ['audio-1.mp3', 'audio-2.mp3', 'audio-3.mp3'];
let queue = [], queueIdx = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function nextTrack() {
  if (queueIdx >= queue.length) {
    const last = queue[queue.length - 1];
    do { queue = shuffle(TRACKS); } while (queue[0] === last);
    queueIdx = 0;
  }
  return queue[queueIdx++];
}

// Textos del banner (visual)
const adTexts = [
  '¿Tu negocio no aparece en Google? En <strong>InfoBlack</strong> te creamos el sitio web y te ponemos en el mapa en menos de una semana. Desde <strong>$50.000</strong>, sin letra chica.',
  'Cada día sin página web es un cliente que se va donde la competencia. <strong>InfoBlack</strong> te pone en internet esta semana.',
  'Soy Willson, de <strong>InfoBlack</strong>, Linares. Sitio web, Google Maps y redes sociales. Todo en una semana, con precio claro.'
];

// Waveform radio
for (let i = 0; i < 36; i++) {
  const b = document.createElement('div');
  b.className = 'waveform-bar';
  b.style.height = (Math.random() * 26 + 4) + 'px';
  b.style.animationDelay = (i * 0.04) + 's';
  waveformEl.appendChild(b);
}

// Waveform ad
for (let i = 0; i < 20; i++) {
  const b = document.createElement('div');
  b.className = 'ad-wave-bar';
  b.style.height = (Math.random() * 14 + 4) + 'px';
  b.style.animationDelay = (i * 0.05) + 's';
  adWaveEl.appendChild(b);
}

function setWave(on) {
  document.querySelectorAll('.waveform-bar').forEach(b =>
    on ? b.classList.add('active') : b.classList.remove('active'));
}
function setAdWave(on) {
  document.querySelectorAll('.ad-wave-bar').forEach(b =>
    on ? b.classList.add('on') : b.classList.remove('on'));
}
function setIcon(playing) {
  iconPlay.innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

// ── Ring countdown ──────────────────────────────────────────────
function startRing() {
  const mins = parseFloat(adInterval.value);
  ringTotal = Math.round(mins * 60);
  ringSeconds = ringTotal;
  adRingWrap.classList.add('visible');
  updateRing();
  ringId = setInterval(() => {
    ringSeconds--;
    updateRing();
    if (ringSeconds <= 0) { clearInterval(ringId); triggerAd(); }
  }, 1000);
}
function stopRing() {
  clearInterval(ringId);
  adRingWrap.classList.remove('visible');
}
function updateRing() {
  const pct = ringSeconds / ringTotal;
  adRingFill.style.strokeDashoffset = 113 * (1 - pct);
  const m = Math.floor(ringSeconds / 60);
  const s = String(ringSeconds % 60).padStart(2, '0');
  adRingNum.textContent = m > 0 ? m + 'm' : s + 's';
}

// ── Publicidad ──────────────────────────────────────────────────
function triggerAd() {
  adActive = true;

  // Bajar volumen radio (duck) en vez de pausar
  radioEl.volume = 0.30;
  setWave(false);

  // Mostrar banner visual
  adText.innerHTML = adTexts[adIdx++ % adTexts.length];
  adOverlay.classList.add('visible');
  setAdWave(true);

  // Reproducir audio de publicidad
  const track = nextTrack();
  adAudioEl.src = track;
  adAudioEl.volume = 1.0;
  adAudioEl.currentTime = 0;
  adAudioEl.play().catch(() => {});

  // Contador visual en banner
  let countdown = 0;
  adSkipNum.textContent = '...';

  adAudioEl.onloadedmetadata = () => {
    countdown = Math.ceil(adAudioEl.duration);
    adSkipNum.textContent = countdown;
    const t = setInterval(() => {
      countdown--;
      adSkipNum.textContent = countdown;
      if (countdown <= 0) clearInterval(t);
    }, 1000);
  };

  // Cuando termina el audio, subir volumen radio suavemente
  adAudioEl.onended = finishAd;
}

function finishAd() {
  setAdWave(false);
  adOverlay.classList.remove('visible');
  adPaused = false;
  adActive = false;
  document.getElementById('adPauseBtn').textContent = '⏸ Pausar';
  document.getElementById('adPauseBtn').classList.remove('paused');
  let vol = 0.30;
  const fadeIn = setInterval(() => {
    vol = Math.min(1.0, vol + 0.05);
    radioEl.volume = vol;
    if (vol >= 1.0) { clearInterval(fadeIn); setWave(true); }
  }, 100);
  if (isPlaying) startRing();
}

let adPaused = false;
function toggleAdPause() {
  const btn = document.getElementById('adPauseBtn');
  if (!adActive) return;
  if (adPaused) {
    adAudioEl.play().catch(() => {});
    adPaused = false;
    btn.textContent = '⏸ Pausar';
    btn.classList.remove('paused');
  } else {
    adAudioEl.pause();
    adPaused = true;
    btn.textContent = '▶ Reanudar';
    btn.classList.add('paused');
  }
}

// ── Radio play/pause ────────────────────────────────────────────
function play() {
  radioEl.src = currentUrl;
  radioEl.play().then(() => {
    isPlaying = true;
    setIcon(true);
    setWave(true);
    trackSub.textContent = '🔴 En vivo';
    stopRing();
    startRing();
    // Pre-cargar primer track de publicidad
    queue = shuffle(TRACKS); queueIdx = 0;
    adAudioEl.src = queue[0];
  }).catch(() => {
    trackSub.textContent = '⚠ No se pudo conectar al stream';
  });
}

function pause() {
  radioEl.pause();
  isPlaying = false;
  setIcon(false);
  setWave(false);
  trackSub.textContent = 'Pausado';
  stopRing();
}

btnPlay.addEventListener('click', () => {
  if (adActive) return;
  isPlaying ? pause() : play();
});

// Selección de radio y botón eliminar
function initRadioButtons() {
  radioList.querySelectorAll('.radio-btn').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';

    // Agregar botón eliminar si no existe
    if (!btn.querySelector('.radio-del')) {
      const del = document.createElement('button');
      del.className = 'radio-del';
      del.title = 'Eliminar';
      del.innerHTML = '✕';
      del.addEventListener('click', e => {
        e.stopPropagation();
        const name = btn.dataset.name;
        if (confirm(`¿Eliminar "${name}" de la lista?`)) {
          if (btn.classList.contains('active')) { pause(); }
          // Guardar en localStorage para persistir
          const deleted = getDeleted();
          if (!deleted.includes(btn.dataset.url)) {
            deleted.push(btn.dataset.url);
            saveDeleted(deleted);
          }
          btn.remove();
        }
      });
      btn.appendChild(del);
    }

    btn.addEventListener('click', () => {
      radioList.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentUrl  = btn.dataset.url;
      currentName = btn.dataset.name;
      trackTitle.textContent = currentName;
      pause();
      setTimeout(play, 300);
    });
  });
}

// URL personalizada
btnCustom.addEventListener('click', () => {
  const url = customUrl.value.trim();
  if (!url) return;
  radioList.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
  // Crear botón en la lista
  const newBtn = document.createElement('button');
  newBtn.className = 'radio-btn active';
  newBtn.dataset.url = url;
  newBtn.dataset.name = 'Stream personalizado';
  newBtn.innerHTML = `<span class="radio-icon">📡</span><div class="radio-info"><div class="radio-name">Stream personalizado</div><div class="radio-freq">${url.substring(0,40)}...</div></div><span class="radio-check">✓</span>`;
  radioList.appendChild(newBtn);
  initRadioButtons();
  currentUrl  = url;
  currentName = 'Stream personalizado';
  trackTitle.textContent = currentName;
  trackSub.textContent   = 'Presiona play para comenzar';
  customUrl.value = '';
  if (isPlaying) { pause(); setTimeout(play, 300); }
});
customUrl.addEventListener('keydown', e => { if (e.key === 'Enter') btnCustom.click(); });

// Reconectar si se corta el stream
radioEl.addEventListener('error', () => {
  if (isPlaying && !adActive) {
    trackSub.textContent = '⚠ Reconectando...';
    setTimeout(play, 3000);
  }
});

// Wake Lock (evitar que la pantalla se duerma)
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { await navigator.wakeLock.request('screen'); } catch(e) {}
  }
}
requestWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

// ── Service Worker (PWA) ────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ── PWA Install banner ─────────────────────────────────────────
let deferredPrompt = null;
const installBanner = document.getElementById('installBanner');
const btnInstall    = document.getElementById('btnInstall');
const btnInstallClose = document.getElementById('btnInstallClose');

// Android Chrome: capturar el prompt automático
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.style.display = 'flex';
});

// Si la app ya está instalada, ocultar banner
window.addEventListener('appinstalled', () => {
  installBanner.style.display = 'none';
  deferredPrompt = null;
});

btnInstall.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.style.display = 'none';
  } else {
    // Fallback para iOS o si no hay prompt
    alert('Para instalar:\n\nAndroid: Menú del navegador → "Agregar a pantalla de inicio"\n\niPhone: Botón compartir → "Agregar a pantalla de inicio"');
  }
});

btnInstallClose.addEventListener('click', () => {
  installBanner.style.display = 'none';
  sessionStorage.setItem('installDismissed', '1');
});

// Mostrar banner a los 2 segundos si no fue descartado en esta sesión
if (!sessionStorage.getItem('installDismissed') && !window.matchMedia('(display-mode: standalone)').matches) {
  setTimeout(() => {
    if (installBanner.style.display === 'none' || !installBanner.style.display) {
      installBanner.style.display = 'flex';
    }
  }, 2000);
}

// ── Eliminación persistente de radios ──────────────────────────
const DELETED_KEY = 'ib_deleted_radios';

function getDeleted() {
  return JSON.parse(localStorage.getItem(DELETED_KEY) || '[]');
}
function saveDeleted(list) {
  localStorage.setItem(DELETED_KEY, JSON.stringify(list));
}

// Ocultar radios eliminadas al cargar
function applyDeleted() {
  const deleted = getDeleted();
  radioList.querySelectorAll('.radio-btn').forEach(btn => {
    if (deleted.includes(btn.dataset.url)) btn.remove();
  });
}
applyDeleted();
initRadioButtons();
</script>
